<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS</title>
          <link rel="stylesheet" href="/style2.css?v={{ asset_ver('style2.css') }}">
  <link rel="stylesheet" href="/mobile-invoice.css?v={{ asset_ver('mobile-invoice.css') }}">
</head>
<body>

<div class="topbar">
  <div class="logo">
    <img src="/logo.png" class="logo-emoji logo-img" alt="logo">
    <div>
      <div class="title" id="app-title">{{ restaurant_name }}</div>
      <div class="subtitle" data-i18n="appSubtitle">نظام نقاط البيع الاحترافي</div>
    </div>
  </div>
  <div class="top-actions">
    <div class="lang-dropdown" id="size-dropdown">
      <button class="btn btn-secondary" onclick="toggleSizeDropdown()" id="btn-size" title="حجم الخط">🔍 <span id="size-label">100%</span></button>
      <div class="lang-dropdown-menu" id="size-menu">
        <button class="lang-option" onclick="setSize('sm'); closeSizeDropdown();">100%</button>
        <button class="lang-option" onclick="setSize('md'); closeSizeDropdown();">115%</button>
        <button class="lang-option" onclick="setSize('lg'); closeSizeDropdown();">125%</button>
        <button class="lang-option" onclick="setSize('xl'); closeSizeDropdown();">140%</button>
      </div>
    </div>
    <button class="btn btn-secondary" id="btn-theme" onclick="toggleTheme()" title="الوضع الليلي/النهاري">🌙</button>
    <div class="lang-dropdown" id="lang-dropdown">
      <button class="btn btn-secondary" onclick="toggleLangDropdown()" id="btn-lang" title="اللغة">🇮🇩</button>
      <div class="lang-dropdown-menu" id="lang-menu">
        <button class="lang-option" onclick="setLang('ar'); closeLangDropdown();">🇸🇦 العربية</button>
        <button class="lang-option" onclick="setLang('en'); closeLangDropdown();">🇬🇧 English</button>
        <button class="lang-option" onclick="setLang('id'); closeLangDropdown();">🇮🇩 Bahasa</button>
      </div>
    </div>
    <button class="btn btn-info" onclick="showReports()" data-i18n="reports">📊 التقارير</button>
    <button class="btn btn-success" onclick="openDepositModal()" data-i18n="depositVoucher">🧾 سند قبض</button>
