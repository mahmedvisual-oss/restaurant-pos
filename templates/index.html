<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS</title>
          <link rel="stylesheet" href="/style2.css?v={{ asset_ver('style2.css') }}">
  <link rel="stylesheet" href="/mobile-invoice.css?v={{ asset_ver('mobile-invoice.css') }}">
</head>
<body>

<div class="topbar">
  <div class="logo">
    <img src="/logo.png" class="logo-emoji logo-img" alt="logo">
    <div>
      <div class="title" id="app-title">{{ restaurant_name }}</div>
      <div class="subtitle" data-i18n="appSubtitle">نظام نقاط البيع الاحترافي</div>
    </div>
  </div>
  <div class="top-actions">
    <div class="lang-dropdown" id="size-dropdown">
      <button class="btn btn-secondary" onclick="toggleSizeDropdown()" id="btn-size" title="حجم الخط">🔍 <span id="size-label">100%</span></button>
      <div class="lang-dropdown-menu" id="size-menu">
        <button class="lang-option" onclick="setSize('sm'); closeSizeDropdown();">100%</button>
        <button class="lang-option" onclick="setSize('md'); closeSizeDropdown();">115%</button>
        <button class="lang-option" onclick="setSize('lg'); closeSizeDropdown();">125%</button>
        <button class="lang-option" onclick="setSize('xl'); closeSizeDropdown();">140%</button>
      </div>
    </div>
    <button class="btn btn-secondary" id="btn-theme" onclick="toggleTheme()" title="الوضع الليلي/النهاري">🌙</button>
    <div class="lang-dropdown" id="lang-dropdown">
      <button class="btn btn-secondary" onclick="toggleLangDropdown()" id="btn-lang" title="اللغة">🇮🇩</button>
      <div class="lang-dropdown-menu" id="lang-menu">
        <button class="lang-option" onclick="setLang('ar'); closeLangDropdown();">🇸🇦 العربية</button>
        <button class="lang-option" onclick="setLang('en'); closeLangDropdown();">🇬🇧 English</button>
        <button class="lang-option" onclick="setLang('id'); closeLangDropdown();">🇮🇩 Bahasa</button>
      </div>
    </div>
    <button class="btn btn-info" onclick="showReports()" data-i18n="reports">📊 التقارير</button>
    <button class="btn btn-success" onclick="openDepositModal()" data-i18n="depositVoucher">🧾 سند قبض</button>
    <button class="btn btn-info" onclick="window.open('/kitchen', '_blank')" data-i18n="kitchen">🧑‍🍳 المطبخ</button>
    <button class="btn btn-warning" onclick="showReservationManager()" data-i18n="reservationTitle">📅 الحجوزات</button>
    <button class="btn btn-secondary" onclick="showCustomersDb()" data-i18n="customersTitle">👥 العملاء</button>
    <button class="btn btn-warning" id="btn-day-close" style="display:none" onclick="onDayButton()" data-i18n="dayClose">📆 إغلاق اليوم</button>
    <button class="btn btn-success" id="btn-menu-mgr" style="display:none" onclick="showMenuManager()" data-i18n="menuManage">🍽️ إدارة القائمة</button>
    <div class="lang-dropdown" id="manager-dropdown" style="display:none">
      <button class="btn btn-secondary" onclick="toggleManagerDropdown()" id="btn-manager">🛠️ <span data-i18n="managerTools">أدوات المدير</span></button>
      <div class="lang-dropdown-menu" id="manager-menu">
        <button class="lang-option" onclick="showPromoManager(); closeManagerDropdown();" data-i18n="promoTitle">🏷️ أكواد الخصم</button>
        <button class="lang-option" onclick="showInventoryManager(); closeManagerDropdown();" data-i18n="inventoryTitle">📦 إدارة المخزون</button>
        <button class="lang-option" onclick="showLoyaltyManager(); closeManagerDropdown();" data-i18n="loyaltyTitle">⭐ نقاط الولاء</button>
        <button class="lang-option" onclick="showBackup(); closeManagerDropdown();" data-i18n="backup">💾 نسخ احتياطي</button>
        <button class="lang-option" onclick="onDayButton(); closeManagerDropdown();" data-i18n="dayClose">📆 إغلاق اليوم</button>
        <button class="lang-option" onclick="showAudit(); closeManagerDropdown();" data-i18n="audit">🛡️ السجل</button>
      </div>
    </div>
    <button class="btn btn-secondary" id="btn-settings" onclick="showSettings()" data-i18n="settings">⚙️ الإعدادات</button>
    <div class="user-box" id="user-box" style="display:none">
      <span id="user-label" class="user-label"></span>
      <button class="btn btn-danger btn-sm" onclick="doLogout()" data-i18n="logout">🚪 خروج</button>
    </div>
  </div>
</div>

<div id="day-reminder" class="day-reminder" style="display:none" onclick="showDayClose()">
  <span id="day-reminder-msg" data-i18n="dayReminder">⏰ لم يُغلق حساب اليوم بعد — يرجى إغلاق اليوم وطباعة التقرير اليومي</span>
  <button class="btn btn-warning btn-sm" data-i18n="dayClose">📆 إغلاق اليوم</button>
</div>

<div id="login-overlay" class="login-overlay">
  <div class="login-card">
    <img src="/logo.png" class="login-emoji login-img" alt="logo">
    <div class="login-title" id="login-title">{{ restaurant_name }}</div>
    <div class="login-sub" data-i18n="appSubtitle">نظام نقاط البيع الاحترافي</div>
    <select id="login-employee" class="login-select"></select>
    <input id="login-pin" type="password" class="login-input" data-i18n="enterPin" placeholder="🔒 أدخل PIN" inputmode="numeric" maxlength="6">
    <div id="login-error" class="login-error"></div>
    <button class="btn btn-success btn-block" onclick="doLogin()" data-i18n="login">🔓 تسجيل الدخول</button>
  </div>
</div>

<!-- باقي الصفحة محفوظ كما هو في النسخة الحالية -->

        <script src="/lang.js?v={{ asset_ver('lang.js') }}"></script>
  <script src="/app.js?v={{ asset_ver('app.js') }}"></script>
  <script src="/voucher-reprint-fix.js?v=20260819"></script>
  <script src="/payment-methods.js?v={{ asset_ver('payment-methods.js') }}"></script>
</body>
</html>
