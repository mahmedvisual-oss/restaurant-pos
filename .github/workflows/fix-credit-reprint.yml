name: Fix credit receipt reprint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch only printCreditReceipt
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("public/app.js")
          s = p.read_text(encoding="utf-8")

          pattern = r'(function printCreditReceipt\(r\)\s*\{.*?\n)(\s*w\.document\.close\(\);\s*\n\s*w\.focus\(\);\s*\n\s*w\.print\(\);\s*\n\s*w\.close\(\);\s*\n\})'

          replacement = r'''\1  w.document.close();

  // Keep the receipt window alive while the browser opens the print dialog.
  setTimeout(() => {
    try {
      w.focus();
      w.print();
    } catch (e) {
      console.error("CREDIT RECEIPT PRINT ERROR:", e);
      toast("⚠️ " + t("toast.allowPopups"));
    }
  }, 150);
}'''

          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("ERROR: printCreditReceipt target not found; no change made.")

          p.write_text(s2, encoding="utf-8")
          print("OK: printCreditReceipt patched.")

      - name: Verify target
        shell: python
        run: |
          from pathlib import Path
          s = Path("public/app.js").read_text(encoding="utf-8")
          start = s.index("function printCreditReceipt(r)")
          end = s.index("function printCustReceipt", start)
          block = s[start:end]
          if "w.print();" not in block:
              raise SystemExit("ERROR: print call missing after patch")
          if "w.close();" in block:
              raise SystemExit("ERROR: credit receipt still closes popup")
          print("VERIFIED: credit receipt has print() and no w.close().")

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git rm .github/workflows/fix-credit-reprint.yml
          git commit -m "fix: repair credit receipt reprint"
          git push