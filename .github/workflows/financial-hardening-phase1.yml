name: Financial hardening phase 1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: "!contains(github.event.head_commit.message, '[financial-phase1]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch receivables and deposit voucher accounting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          # 1) Extend deposit_vouchers so every receipt records how much was
          #    actually applied to receivables and how much remains as an advance.
          old = '''    c.execute('''CREATE TABLE IF NOT EXISTS deposit_vouchers (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        receipt_no TEXT UNIQUE,\n        customer_name TEXT,\n        phone TEXT,\n        party_date TEXT,\n        description TEXT,\n        amount REAL DEFAULT 0,\n        method TEXT DEFAULT 'نقدي',\n        transfer_ref TEXT,\n        transfer_name TEXT,\n        employee TEXT,\n        date TEXT DEFAULT (datetime('now','localtime'))\n    )''')'''
          new = '''    c.execute('''CREATE TABLE IF NOT EXISTS deposit_vouchers (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        receipt_no TEXT UNIQUE,\n        customer_name TEXT,\n        phone TEXT,\n        party_date TEXT,\n        description TEXT,\n        amount REAL DEFAULT 0,\n        method TEXT DEFAULT 'نقدي',\n        transfer_ref TEXT,\n        transfer_name TEXT,\n        employee TEXT,\n        date TEXT DEFAULT (datetime('now','localtime')),\n        customer_id INTEGER,\n        applied_amount REAL DEFAULT 0,\n        unapplied_amount REAL DEFAULT 0\n    )''')'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              # Keep existing deployments compatible: add columns below via PRAGMA.
              pass

          marker = '''    cols_cp = [r[1] for r in c.execute("PRAGMA table_info(credit_payments)").fetchall()]'''
          if marker in s and '"applied_amount" not in cols_dv' not in s:
              insert = '''    cols_dv = [r[1] for r in c.execute("PRAGMA table_info(deposit_vouchers)").fetchall()]\n    if "customer_id" not in cols_dv:\n        c.execute("ALTER TABLE deposit_vouchers ADD COLUMN customer_id INTEGER")\n    if "applied_amount" not in cols_dv:\n        c.execute("ALTER TABLE deposit_vouchers ADD COLUMN applied_amount REAL DEFAULT 0")\n    if "unapplied_amount" not in cols_dv:\n        c.execute("ALTER TABLE deposit_vouchers ADD COLUMN unapplied_amount REAL DEFAULT 0")\n'''
              s = s.replace(marker, insert + marker, 1)

          # 2) Replace the deposit endpoint completely. It is atomic: voucher,
          #    allocations and credit payments are committed together.
          start = s.find('@app.route("/api/deposit-voucher"')
          if start < 0:
              raise SystemExit('deposit-voucher route not found')
          next_route = s.find('\n@app.route(', start + 10)
          if next_route < 0:
              raise SystemExit('next route after deposit-voucher not found')

          replacement = r'''@app.route("/api/deposit-voucher", methods=["POST"])
def api_deposit_voucher():
    """سند قبض موحد: يسجل السند دائماً، ويربط المبلغ بذمم العميل تلقائياً.

    القاعدة المالية: الفاتورة الآجلة ليست تحصيلاً. التحصيل لا يدخل
    credit_payments إلا عندما يوجد سند قبض/دفعة فعلية.
    """
    u = require_user()
    if not u:
        return jsonify({"error": "سجل الدخول أولاً"}), 401

    data = request.json or {}
    customer_name = str(data.get("customer_name") or "").strip()
    phone = str(data.get("phone") or "").strip()
    party_date = str(data.get("party_date") or "").strip()
    description = str(data.get("description") or "").strip()
    method = _canon_method(str(data.get("method") or "نقدي").strip())
    transfer_ref = str(data.get("transfer_ref") or "").strip()
    amount = _amount(data, "amount", 0)

    if not customer_name and not phone:
        return jsonify({"error": "اسم العميل أو رقم الهاتف مطلوب"}), 400
    if amount <= 0:
        return jsonify({"error": "مبلغ غير صالح"}), 400
    if method in ("آجل", "Credit", "Kredit"):
        return jsonify({"error": "سند القبض يجب أن يكون بطريقة دفع فعلية، وليس آجلاً"}), 400
    if method in ("BCA", "مانديري", "كيروس") and not transfer_ref:
        return jsonify({"error": "مرجع التحويل مطلوب"}), 400

    conn = get_db()
    c = conn.cursor()
    try:
        # Resolve the customer by phone first, then exact normalized name.
        customer = None
        if phone:
            customer = c.execute(
                "SELECT * FROM customers WHERE lower(trim(phone))=lower(trim(?)) LIMIT 1",
                (phone,)
            ).fetchone()
        if not customer and customer_name:
            customer = c.execute(
                "SELECT * FROM customers WHERE lower(trim(name))=lower(trim(?)) LIMIT 1",
                (customer_name,)
            ).fetchone()

        # If the cashier entered a new customer, create the master customer now.
        # This prevents future payments from becoming name-only orphan records.
        if not customer:
            try:
                c.execute("INSERT INTO customers (name, phone) VALUES (?,?)",
                          (customer_name or phone, phone or None))
                customer = c.execute("SELECT * FROM customers WHERE id=?", (c.lastrowid,)).fetchone()
            except Exception:
                # A concurrent phone insert may have won the race; resolve it again.
                if phone:
                    customer = c.execute(
                        "SELECT * FROM customers WHERE lower(trim(phone))=lower(trim(?)) LIMIT 1",
                        (phone,)
                    ).fetchone()
                if not customer:
                    raise

        cid = customer["id"]
        canonical_name = customer["name"] or customer_name or phone
        canonical_phone = customer["phone"] or phone or ""

        # Find all open receivables for this customer. Legacy rows without
        # customer_id are matched by phone/name and are repaired in-place.
        ledgers = c.execute(
            """SELECT * FROM credit_ledger
               WHERE status='open' AND (\n                   customer_id=? OR\n                   (customer_id IS NULL AND lower(trim(COALESCE(phone,'')))=lower(trim(?))) OR\n                   (customer_id IS NULL AND lower(trim(COALESCE(customer_name,'')))=lower(trim(?)))\n               )
               ORDER BY datetime(created_at) ASC, id ASC""",
            (cid, canonical_phone, canonical_name)
        ).fetchall()

        # Link legacy ledgers to the master customer.
        for l in ledgers:
            if not l["customer_id"]:
                c.execute("UPDATE credit_ledger SET customer_id=?, phone=?, customer_name=? WHERE id=?",
                          (cid, canonical_phone, canonical_name, l["id"]))

        # Create the voucher first so the same receipt number can be attached
        # to every allocation generated by this one real-world payment.
        now = _now_sql()
        c.execute(
            """INSERT INTO deposit_vouchers
               (receipt_no, customer_name, phone, party_date, description, amount,
                method, transfer_ref, employee, date, customer_id, applied_amount, unapplied_amount)
               VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)""",
            (None, canonical_name, canonical_phone, party_date, description, amount,
             method, transfer_ref or None, u["name"], now, cid, 0, amount)
        )
        vid = c.lastrowid
        receipt_no = "DV-%d-%05d" % (_now().year, vid)
        c.execute("UPDATE deposit_vouchers SET receipt_no=? WHERE id=?", (receipt_no, vid))

        remaining_payment = round(amount, 2)
        applied = 0.0
        allocations = []

        for l in ledgers:
            current_paid = round(float(l["paid"] or 0), 2)
            total = round(float(l["total"] or 0), 2)
            due = round(max(0.0, total - current_paid), 2)
            if due <= 0 or remaining_payment <= 0:
                continue
            part = round(min(remaining_payment, due), 2)
            new_paid = round(current_paid + part, 2)
            new_status = "settled" if new_paid >= total else "open"
            c.execute(
                "UPDATE credit_ledger SET paid=?, status=?, updated_at=? WHERE id=?",
                (new_paid, new_status, now, l["id"])
            )
            c.execute(
                """INSERT INTO credit_payments
                   (ledger_id, amount, method, employee, receipt_no, date)
                   VALUES (?,?,?,?,?,?)""",
                (l["id"], part, method, u["name"], receipt_no, now)
            )
            allocations.append({
                "ledger_id": l["id"],
                "order_id": l["order_id"],
                "amount": part,
                "remaining": round(total - new_paid, 2),
                "status": new_status,
            })
            applied = round(applied + part, 2)
            remaining_payment = round(remaining_payment - part, 2)

        c.execute(
            "UPDATE deposit_vouchers SET applied_amount=?, unapplied_amount=? WHERE id=?",
            (applied, remaining_payment, vid)
        )
        conn.commit()

        voucher = {
            "id": vid,
            "receipt_no": receipt_no,
            "customer_name": canonical_name,
            "phone": canonical_phone,
            "party_date": party_date,
            "description": description,
            "amount": amount,
            "method": method,
            "transfer_ref": transfer_ref,
            "employee": u["name"],
            "date": now,
            "customer_id": cid,
            "applied_amount": applied,
            "unapplied_amount": remaining_payment,
            "allocations": allocations,
        }
        audit("deposit_voucher", f"سند قبض {receipt_no} للعميل {canonical_name}: {amount:.2f} - مسدد {applied:.2f} - غير موزع {remaining_payment:.2f}")
        return jsonify({"ok": True, "voucher": voucher})
    except Exception as e:
        try:
            conn.rollback()
        except Exception:
            pass
        return jsonify({"error": "تعذر تسجيل سند القبض: " + str(e)}), 500
    finally:
        conn.close()
'''
          s = s[:start] + replacement + s[next_route:]

          # 3) Make direct credit settlement reject overpayment and the invalid
          #    "آجل" payment method instead of silently clipping the ledger.
          old_settle = '''    amount = _amount(data, "amount", 0)\n    method = str(data.get("method") or "نقدي")\n    if not lid:'''
          new_settle = '''    amount = _amount(data, "amount", 0)\n    method = _canon_method(str(data.get("method") or "نقدي"))\n    if method == "آجل":\n        return jsonify({"error": "لا يمكن تسجيل الآجل كتحصيل"}), 400\n    if not lid:'''
          if old_settle in s:
              s = s.replace(old_settle, new_settle, 1)

          old_over = '''    new_paid = round(row["paid"] + amount, 2)\n    if new_paid > row["total"]:\n        new_paid = row["total"]\n    remaining = round(row["total"] - new_paid, 2)'''
          new_over = '''    current_remaining = round(max(0.0, row["total"] - row["paid"]), 2)\n    if amount > current_remaining + 0.000001:\n        conn.close()\n        return jsonify({"error": f"المبلغ يتجاوز الرصيد المتبقي ({current_remaining:.2f})"}), 400\n    new_paid = round(row["paid"] + amount, 2)\n    remaining = round(row["total"] - new_paid, 2)'''
          if old_over in s:
              s = s.replace(old_over, new_over, 1)

          # 4) One-time financial repair: an "آجل" credit_payment is not a
          #    payment. Recalculate ledger paid from real payment rows only.
          repair_marker = 'FINANCIAL_PHASE1_REPAIR_V1'
          if repair_marker not in s:
              anchor = '    conn.commit()\n    conn.close()\n\n\ndef require_user():'
              repair = '''    # FINANCIAL_PHASE1_REPAIR_V1\n    # Remove legacy fake collections created with the invoice method "آجل".\n    c.execute("DELETE FROM credit_payments WHERE method='آجل'")\n    c.execute("""UPDATE credit_ledger\n                 SET paid=COALESCE((SELECT MIN(credit_ledger.total, SUM(cp.amount))\n                                    FROM credit_payments cp\n                                    WHERE cp.ledger_id=credit_ledger.id), 0),\n                     status=CASE WHEN COALESCE((SELECT SUM(cp.amount) FROM credit_payments cp WHERE cp.ledger_id=credit_ledger.id),0) >= total\n                                  THEN 'settled' ELSE 'open' END,\n                     updated_at=?""", (_now_sql(),))\n'''
              if anchor in s:
                  s = s.replace(anchor, '    conn.commit()\n    conn.close()\n\n' + repair + '\n\ndef require_user():', 1)
              else:
                  raise SystemExit('schema repair anchor not found')

          p.write_text(s, encoding='utf-8')
          print('financial phase 1 patch applied')
          PY

      - name: Syntax check
        shell: bash
        run: python3 -m py_compile app.py

      - name: Commit patched application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/financial-hardening-phase1.yml
          git add app.py .github/workflows/financial-hardening-phase1.yml
          git diff --cached --quiet && exit 0
          git commit -m "Harden receivables and deposit voucher accounting [financial-phase1]"
          git push origin HEAD:main
