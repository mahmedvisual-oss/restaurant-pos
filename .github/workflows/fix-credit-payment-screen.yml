name: Fix credit payment screen

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[credit-payment-screen-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch payment history and cash collection reports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = 'paymap = {}\n    for p in c.execute("SELECT * FROM credit_payments ORDER BY date ASC, id ASC").fetchall():\n        paymap.setdefault(p["ledger_id"], []).append(dict(p))'
          new = 'paymap = {}\n    for p in c.execute("SELECT * FROM credit_payments WHERE COALESCE(method, \'\') != \'آجل\' ORDER BY date ASC, id ASC").fetchall():\n        paymap.setdefault(p["ledger_id"], []).append(dict(p))'
          if old not in s:
              raise SystemExit('paymap block not found')
          s = s.replace(old, new, 1)

          old = 'pmt_where = "1=1"\n    pmt_params = []'
          new = 'pmt_where = "COALESCE(p.method, \'\') != \'آجل\'"\n    pmt_params = []'
          if old not in s:
              raise SystemExit('AR payment filter block not found')
          s = s.replace(old, new, 1)

          old = 'cr_sql = "SELECT COALESCE(SUM(amount),0) AS t FROM credit_payments WHERE 1=1"'
          new = 'cr_sql = "SELECT COALESCE(SUM(amount),0) AS t FROM credit_payments WHERE COALESCE(method, \'\') != \'آجل\'"'
          if old not in s:
              raise SystemExit('advanced credit collection query not found')
          s = s.replace(old, new, 1)

          old = 'cr_where = "1=1"\n    cr_params = []'
          new = 'cr_where = "COALESCE(method, \'\') != \'آجل\'"\n    cr_params = []'
          if old not in s:
              raise SystemExit('income credit collection filter not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile app.py
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-credit-payment-screen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/fix-credit-payment-screen.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix credit payment screen totals [credit-payment-screen-fixed]"
          git push origin HEAD:main
