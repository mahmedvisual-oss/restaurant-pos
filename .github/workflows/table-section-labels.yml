name: Table section labels patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[section-labels]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add section labels to transfer dialog
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')
          names = {"families":"العائلات", "vip":"VIP", "hall":"الصالة", "takeaway":"تيك أواي"}
          marker = '  const curLabel = cur ? cur.num : selectedTable;'
          if marker in s:
              s = s.replace(marker, '  const curSection = cur ? (cur.section_name || names[cur.section] || cur.section || "") : "";\n  const curLabel = cur ? `${cur.num} — ${curSection}` : selectedTable;', 1)
          marker = '    const status = tb.active ? "🔴" : "🟢";'
          start = s.find(marker)
          if start >= 0 and 'const sectionName = tb.section_name' not in s[start:start+500]:
              s = s[:start] + '    const sectionName = tb.section_name || names[tb.section] || tb.section || "";\n    const tableLabel = `${tb.num} — ${sectionName}`;\n' + s[start:]
          old = 'html += `<button class="transfer-table-btn" onclick="transferOrder(${tid})" ${disabled}>`'
          if old in s:
              s = s.replace(old, 'html += `<button class="transfer-table-btn" onclick="transferOrder(${tid})" ${disabled}><span>${status} <b>${tableLabel}</b></span>`', 1)
          old = 'const fromLabel = tableData[selectedTable] ? tableData[selectedTable].num : selectedTable;'
          if old in s:
              s = s.replace(old, 'const from = tableData[selectedTable] || {};\n  const fromLabel = `${from.num ?? selectedTable} — ${from.section_name || names[from.section] || from.section || ""}`.replace(/ — $/, "");', 1)
          old = 'const toLabel = tableData[toTable] ? tableData[toTable].num : toTable;'
          if old in s:
              s = s.replace(old, 'const to = tableData[toTable] || {};\n  const toLabel = `${to.num ?? toTable} — ${to.section_name || names[to.section] || to.section || ""}`.replace(/ — $/, "");', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git rm .github/workflows/table-section-labels.yml
          git commit -m "Show table sections in transfer dialog [section-labels]"
          git push
