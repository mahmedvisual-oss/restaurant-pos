name: One-time cloud language repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[language-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair language persistence and Indonesian leakage guard
        run: |
          python - <<'PY'
          from pathlib import Path

          lang = Path('public/lang.js')
          s = lang.read_text(encoding='utf-8-sig')
          old = 'let currentLang = "id";'
          new = 'let currentLang = localStorage.getItem("pos_lang") || "id";'
          if old not in s:
              raise SystemExit('currentLang initializer not found')
          s = s.replace(old, new, 1)
          lang.write_text(s, encoding='utf-8-sig')

          for name in ['templates/index.html', 'templates/kitchen.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8-sig')
              if '/indonesian-ui-fix.js' not in s:
                  marker = '</body>'
                  if marker not in s:
                      raise SystemExit(f'{name}: </body> not found')
                  tag = '<script src="/indonesian-ui-fix.js?v={{ asset_ver(\'indonesian-ui-fix.js\') }}"></script>\n'
                  s = s.replace(marker, tag + marker, 1)
                  p.write_text(s, encoding='utf-8-sig')
          PY

      - name: Commit repair and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/lang.js templates/index.html templates/kitchen.html
          git rm .github/workflows/one-time-language-repair.yml
          git commit -m "fix: repair cloud language persistence and Indonesian UI leakage [language-fix]"
          git push origin main
