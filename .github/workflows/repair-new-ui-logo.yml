name: Repair new UI logo
on:
  push:
    branches: ["test/clean-start"]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'mahmedvisual-oss'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/clean-start
          fetch-depth: 0
      - name: Restore safe CSS and remove UI logo markup
        shell: bash
        run: |
          git show fee77bcb0bc04f0db889e3cb9c011820db3e8f36:public/style2.css > public/style2.css
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/index.html')
          s = p.read_text(encoding='utf-8-sig')
          s = s.replace('<div class="logo">', '<div class="brand-name">')
          s = s.replace('    <img src="/logo.png" class="login-emoji login-img" alt="logo">\n', '')
          s = s.replace('    <img src="/logo.png" class="login-img" alt="logo">\n', '')
          s = s.replace('    <img src="/logo.png" class="login-emoji" alt="logo">\n', '')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/repair-new-ui-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html public/style2.css .github/workflows/repair-new-ui-logo.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix new UI logo removal without changing POS logic"
          git push origin HEAD:test/clean-start
