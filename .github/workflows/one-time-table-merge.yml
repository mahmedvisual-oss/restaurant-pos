name: One-time table merge patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[table-merge]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply table move/merge and section labels patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')
          section_names = {"families":"العائلات", "vip":"VIP", "hall":"الصالة", "takeaway":"تيك أواي"}
          marker = '  const curLabel = cur ? cur.num : selectedTable;'
          if marker in s:
              s = s.replace(marker, '  const curSection = cur ? (cur.section_name || section_names[cur.section] || cur.section || "") : "";\n  const curLabel = cur ? `${cur.num} — ${curSection}` : selectedTable;', 1)
          marker2 = '    const status = tb.active ? "🔴" : "🟢";'
          pos = s.find(marker2)
          if pos >= 0:
              s = s[:pos] + '    const sectionName = tb.section_name || section_names[tb.section] || tb.section || "";\n    const tableLabel = `${tb.num} — ${sectionName}`;\n' + s[pos:]
          old = 'html += `<button class="transfer-table-btn" onclick="transferOrder(${tid})" ${disabled}>`'
          if old in s:
              s = s.replace(old, 'html += `<button class="transfer-table-btn" onclick="transferOrder(${tid})" ${disabled}><span>${status} <b>${tableLabel}</b></span>`', 1)
          old_confirm = 'const fromLabel = tableData[selectedTable] ? tableData[selectedTable].num : selectedTable;'
          if old_confirm in s:
              s = s.replace(old_confirm, 'const from = tableData[selectedTable] || {};\n  const fromLabel = `${from.num ?? selectedTable} — ${from.section_name || section_names[from.section] || from.section || ""}`.replace(/ — $/, "");', 1)
          old_to = 'const toLabel = tableData[toTable] ? tableData[toTable].num : toTable;'
          if old_to in s:
              s = s.replace(old_to, 'const to = tableData[toTable] || {};\n  const toLabel = `${to.num ?? toTable} — ${to.section_name || section_names[to.section] || to.section || ""}`.replace(/ — $/, "");', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('templates/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<span>🔄 نقل الطلب</span>', '<span>🔄 نقل / دمج الطلب</span>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js templates/index.html
          git rm .github/workflows/one-time-table-merge.yml
          git commit -m "Show table sections in transfer dialog [table-merge]"
          git push
