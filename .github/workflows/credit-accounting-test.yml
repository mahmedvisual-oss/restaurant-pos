name: Credit accounting regression test
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - '.github/workflows/credit-accounting-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python -m py_compile app.py
      - name: Isolated accounting, reconciliation and cash-closing test
        shell: python
        run: |
          import sqlite3
          db=sqlite3.connect(':memory:')
          c=db.cursor()
          c.execute('CREATE TABLE sales (id INTEGER PRIMARY KEY, total REAL, payment_method TEXT)')
          c.execute('CREATE TABLE credit_ledger (id INTEGER PRIMARY KEY, customer_id INTEGER, total REAL, paid REAL DEFAULT 0, status TEXT, created_at INTEGER)')
          c.execute('CREATE TABLE credit_payments (id INTEGER PRIMARY KEY, ledger_id INTEGER, amount REAL, method TEXT)')

          # Daily sales mix: cash + bank transfer + genuine credit sale.
          c.executemany('INSERT INTO sales(total,payment_method) VALUES(?,?)', [(100000,'نقدي'),(50000,'BCA'),(150000,'آجل')])
          sales_total=c.execute('SELECT SUM(total) FROM sales').fetchone()[0]
          cash_sales=c.execute("SELECT SUM(total) FROM sales WHERE payment_method='نقدي'").fetchone()[0]
          bank_sales=c.execute("SELECT SUM(total) FROM sales WHERE payment_method='BCA'").fetchone()[0]
          credit_sales=c.execute("SELECT SUM(total) FROM sales WHERE payment_method='آجل'").fetchone()[0]
          assert sales_total == 300000
          assert cash_sales + bank_sales + credit_sales == sales_total

          # Credit sale creates a receivable, not a collection.
          c.execute("INSERT INTO credit_ledger(customer_id,total,paid,status,created_at) VALUES(1,150000,0,'open',1)")
          assert c.execute('SELECT COALESCE(SUM(amount),0) FROM credit_payments').fetchone()[0] == 0

          # A cash receipt from receivables is separate from today's cash sales.
          c.execute("INSERT INTO credit_payments(ledger_id,amount,method) VALUES(1,60000,'cash')")
          c.execute("UPDATE credit_ledger SET paid=paid+60000,status=CASE WHEN paid+60000>=total THEN 'paid' ELSE 'open' END WHERE id=1")
          paid,balance,status=c.execute('SELECT paid,total-paid,status FROM credit_ledger WHERE id=1').fetchone()
          assert paid == 60000 and balance == 90000 and status == 'open'

          # Reconciliation: receivables = credit sales - real credit collections.
          real_credit_collections=c.execute('SELECT COALESCE(SUM(amount),0) FROM credit_payments').fetchone()[0]
          outstanding=c.execute('SELECT COALESCE(SUM(total-paid),0) FROM credit_ledger WHERE status IN (\'open\',\'partial\')').fetchone()[0]
          assert credit_sales - real_credit_collections == outstanding

          # Cash closing: opening cash + cash sales + cash collections - cash refunds - expenses = expected cash.
          opening_cash=200000
          cash_refunds=10000
          cash_expenses=15000
          expected_cash=opening_cash + cash_sales + real_credit_collections - cash_refunds - cash_expenses
          assert expected_cash == 335000

          # Bank transfers are not cash-on-hand.
          assert expected_cash != opening_cash + cash_sales + bank_sales + real_credit_collections - cash_refunds - cash_expenses

          # Closing count must expose variance instead of silently changing expected cash.
          actual_cash=330000
          variance=actual_cash-expected_cash
          assert variance == -5000
          assert variance != 0

          # Oldest-first allocation across multiple invoices.
          c.execute("INSERT INTO credit_ledger(customer_id,total,paid,status,created_at) VALUES(1,50000,0,'open',2)")
          receipt=70000
          for ledger_id,total in c.execute("SELECT id,total FROM credit_ledger WHERE customer_id=1 AND status='open' ORDER BY created_at,id"):
              if receipt <= 0: break
              paid=c.execute('SELECT paid FROM credit_ledger WHERE id=?',(ledger_id,)).fetchone()[0]
              applied=min(receipt,total-paid)
              if applied:
                  c.execute("INSERT INTO credit_payments(ledger_id,amount,method) VALUES(?,?,?)",(ledger_id,applied,'cash'))
                  c.execute("UPDATE credit_ledger SET paid=paid+?,status=CASE WHEN paid+?>=total THEN 'paid' ELSE 'open' END WHERE id=?",(applied,applied,ledger_id))
                  receipt-=applied
          rows=c.execute('SELECT id,total,paid,status FROM credit_ledger ORDER BY created_at,id').fetchall()
          assert rows == [(1,150000,60000,'open'),(2,50000,50000,'paid')], rows

          print('PASS: sales reconcile; credit is not collection; receivables reconcile; cash closing excludes bank/credit; variance is exposed; oldest-first allocation works.')
