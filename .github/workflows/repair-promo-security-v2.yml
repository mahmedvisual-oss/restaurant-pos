name: Repair promo security v2

on:
  push:
    paths:
      - .github/workflows/repair-promo-security-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch and verify promo security
        shell: python
        run: |
          from pathlib import Path
          import py_compile

          app = Path("app.py")
          s = app.read_text(encoding="utf-8")

          if "promo_code = str(data.get(\"promo_code\") or \"\").strip().upper()" not in s:
              fn = s.index("def _do_pay(u, data):")
              start = s.index('    paid = _amount(data, "paid")', fn)
              end = s.index('    items_str = _serialize_items(items)', start)
              block = '''    paid = _amount(data, "paid")
          discount = _amount(data, "discount")
          payment_method = str(data.get("payment_method", "نقدي"))
          try:
              guests = int(data.get("guests", 1))
          except (TypeError, ValueError):
              return jsonify({"error": "عدد الأشخاص غير صالح"}), 400
          if guests < 1:
              return jsonify({"error": "عدد الأشخاص يجب أن يكون 1 على الأقل"}), 400
          credit_name = str(data.get("credit_name") or "").strip() or None
          transfer_ref = str(data.get("transfer_ref") or "").strip()
          if transfer_ref in ("", "0", "None", "null"):
              transfer_ref = None
          transfer_name = str(data.get("transfer_name") or "").strip() or None
          if payment_method in ("BCA", "مانديري", "كيروس") and not transfer_ref:
              return jsonify({"error": "التحويل البنكي يتطلب رقم مرجع التحويل"}), 400
          subtotal = round(sum(float(i["price"]) * int(i["qty"]) for i in items), 2)
          tax = round(subtotal * get_tax_rate(), 2)
          max_discount = round(subtotal + tax, 2)
          try:
              manual_discount = round(float(data.get("manual_discount") or 0), 2)
          except (TypeError, ValueError):
              return jsonify({"error": "قيمة الخصم اليدوي غير صالحة"}), 400
          if manual_discount < 0:
              return jsonify({"error": "قيمة الخصم اليدوي غير صالحة"}), 400
          emp_limit_pct = 100.0
          if u.get("role") != "manager" and manual_discount > 0:
              emp_limit_pct = float(u.get("discount_limit") or 20)
              if "discount_limit" not in u:
                  try:
                      tmp = get_db()
                      rmax = tmp.execute("SELECT discount_limit FROM employees WHERE id=? AND active=1", (u["id"],)).fetchone()
                      tmp.close()
                      if rmax and rmax["discount_limit"] is not None:
                          emp_limit_pct = float(rmax["discount_limit"] or 20)
                  except Exception:
                      pass
              emp_limit_amt = round(max_discount * emp_limit_pct / 100.0, 2)
              if manual_discount > emp_limit_amt:
                  return jsonify({"error": f"تجاوزت حد الخصم المسموح لك ({emp_limit_pct:.0f}% = {emp_limit_amt:.2f}). المدير فقط يمكنه خصم أكثر"}), 400
          promo_code = str(data.get("promo_code") or "").strip().upper()
          promo_discount = 0.0
'''
              s = s[:start] + block + s[end:]

          marker = '''    _ensure_schema(conn, c)
          is_new = bool(data.get("new_order"))
'''
          if marker not in s:
              raise SystemExit("PAYMENT_CONNECTION_MARKER_NOT_FOUND")
          insert = '''    _ensure_schema(conn, c)
          promo_row = None
          if promo_code:
              promo_row = c.execute(
                  "SELECT * FROM promo_codes WHERE code=? AND active=1",
                  (promo_code,),
              ).fetchone()
              if not promo_row:
                  conn.close()
                  return jsonify({"error": "كود غير صالح"}), 400
              if promo_row["max_uses"] > 0 and promo_row["used_count"] >= promo_row["max_uses"]:
                  conn.close()
                  return jsonify({"error": "تم استخدام هذا الكود بالكامل"}), 400
              if promo_row["expires_at"] and promo_row["expires_at"] < _now().strftime("%Y-%m-%d"):
                  conn.close()
                  return jsonify({"error": "انتهت صلاحية الكود"}), 400
              if subtotal < float(promo_row["min_order"] or 0):
                  conn.close()
                  return jsonify({"error": f"الحد الأدنى للطلب {promo_row['min_order']}"}), 400
              if promo_row["discount_type"] == "fixed":
                  promo_discount = float(promo_row["discount_value"])
              else:
                  promo_discount = subtotal * float(promo_row["discount_value"]) / 100.0
              promo_discount = round(min(max(promo_discount, 0), subtotal), 2)
          discount = round(min(manual_discount + promo_discount, max_discount), 2)
          total = round(subtotal + tax - discount, 2)
          if total < 0:
              total = 0
          if paid < total and payment_method != "آجل":
              conn.close()
              return jsonify({"error": f"المبلغ المدفوع أقل من الإجمالي ({total:.2f})"}), 400
          is_new = bool(data.get("new_order"))
'''
          s = s.replace(marker, insert, 1)

          claim_marker = '''    # 1) INSERT/UPDATE orders → oid
'''
          if claim_marker not in s:
              raise SystemExit("ORDER_WRITE_MARKER_NOT_FOUND")
          claim = '''    # Claim the promo use atomically inside the same transaction as the invoice.
          # A concurrent payment cannot consume the same last use twice.
          if promo_code:
              claim = c.execute(
                  "UPDATE promo_codes SET used_count=used_count+1 WHERE id=? AND active=1 AND (max_uses=0 OR used_count<max_uses)",
                  (promo_row["id"],),
              )
              if getattr(claim, "rowcount", 0) != 1:
                  conn.close()
                  return jsonify({"error": "تم استخدام هذا الكود بالكامل"}), 400

          # 1) INSERT/UPDATE orders → oid
'''
          s = s.replace(claim_marker, claim, 1)

          app.write_text(s, encoding="utf-8")

          js = Path("public/app.js")
          j = js.read_text(encoding="utf-8")
          old_js = "discount: discount + promoDiscount, manual_discount: discount, payment_method: payMethod,"
          new_js = "discount: discount + promoDiscount, manual_discount: discount, promo_code: promoCode, payment_method: payMethod,"
          if old_js in j:
              j = j.replace(old_js, new_js, 1)
          elif "promo_code: promoCode" not in j:
              raise SystemExit("PAYMENT_JSON_MARKER_NOT_FOUND")
          js.write_text(j, encoding="utf-8")

          py_compile.compile("app.py", doraise=True)

          required = [
              'promo_code = str(data.get("promo_code") or "").strip().upper()',
              'SELECT * FROM promo_codes WHERE code=? AND active=1',
              'UPDATE promo_codes SET used_count=used_count+1',
              'promo_code: promoCode',
          ]
          combined = s + j
          missing = [x for x in required if x not in combined]
          if missing:
              raise SystemExit("PROMO_SECURITY_VERIFY_FAILED: " + repr(missing))
          print("PY_COMPILE_OK")
          print("PROMO_SECURITY_PATCH_OK")

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py public/app.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NO_CHANGES_NEEDED'
            exit 0
          fi
          git commit -m 'fix: enforce promo discounts server-side and count promo usage'
          git push origin HEAD:main
