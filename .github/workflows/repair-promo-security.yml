name: Repair promo security

on:
  push:
    paths:
      - .github/workflows/repair-promo-security.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch server-side promo validation and usage accounting
        shell: python
        run: |
          from pathlib import Path
          from textwrap import indent
          import py_compile

          app = Path('app.py')
          s = app.read_text(encoding='utf-8')

          # 1) Ensure promo_codes exists on fresh databases as well as existing ones.
          fn_schema = s.index('def _ensure_schema(conn, c, log=True):')
          schema_end = s.index('\n\ndef init_db():', fn_schema)
          schema_part = s[fn_schema:schema_end]
          if 'CREATE TABLE IF NOT EXISTS promo_codes' not in schema_part:
              marker = '    try:\n        conn.commit()\n'
              pos = schema_part.rfind(marker)
              if pos < 0:
                  raise SystemExit('SCHEMA_COMMIT_MARKER_NOT_FOUND')
              promo_schema = '''    c.execute(\"\"\"CREATE TABLE IF NOT EXISTS promo_codes (\n        id INTEGER PRIMARY KEY AUTOINCREMENT,\n        code TEXT UNIQUE NOT NULL,\n        discount_type TEXT DEFAULT 'percent',\n        discount_value REAL DEFAULT 0,\n        min_order REAL DEFAULT 0,\n        max_uses INTEGER DEFAULT 0,\n        used_count INTEGER DEFAULT 0,\n        active INTEGER DEFAULT 1,\n        expires_at TEXT,\n        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n    )\"\"\")\n'''
              schema_part = schema_part[:pos] + promo_schema + schema_part[pos:]
              s = s[:fn_schema] + schema_part + s[schema_end:]

          # 2) Rebuild the payment validation block so the browser cannot choose
          # an arbitrary total discount. Promo discount is authoritative on server.
          fn = s.index('def _do_pay(u, data):')
          start = s.index('    paid = _amount(data, "paid")', fn)
          end = s.index('    items_str = _serialize_items(items)', start)
          new = '''    paid = _amount(data, "paid")
          payment_method = str(data.get("payment_method", "نقدي"))
          guests = int(data.get("guests", 1) or 1)
          credit_name = str(data.get("credit_name") or "").strip() or None
          transfer_ref = str(data.get("transfer_ref") or "").strip()
          if transfer_ref in ("", "0", "None", "null"):
              transfer_ref = None
          transfer_name = str(data.get("transfer_name") or "").strip() or None
          if payment_method in ("BCA", "مانديري", "كيروس") and not transfer_ref:
              return jsonify({"error": "التحويل البنكي يتطلب رقم مرجع التحويل"}), 400

          subtotal = round(sum(float(i["price"]) * int(i["qty"]) for i in items), 2)
          tax = round(subtotal * get_tax_rate(), 2)
          max_discount = round(subtotal + tax, 2)

          # Client discount is never authoritative. Only manual_discount and the
          # authoritative promo row may contribute to the final discount.
          try:
              manual_discount = round(float(data.get("manual_discount") or 0), 2)
          except (TypeError, ValueError):
              return jsonify({"error": "قيمة الخصم اليدوي غير صالحة"}), 400
          if manual_discount < 0:
              return jsonify({"error": "قيمة الخصم اليدوي غير صالحة"}), 400

          promo_code = str(data.get("promo_code") or "").strip().upper()
          promo_discount = 0.0
          promo_row = None

          conn = get_db()
          c = conn.cursor()
          _ensure_schema(conn, c)

          emp_limit_pct = 100.0
          if u.get("role") != "manager" and manual_discount > 0:
              emp_limit_pct = float(u.get("discount_limit") or 20)
              if "discount_limit" not in u:
                  try:
                      rmax = c.execute(
                          "SELECT discount_limit FROM employees WHERE id=? AND active=1",
                          (u["id"],),
                      ).fetchone()
                      if rmax and rmax["discount_limit"] is not None:
                          emp_limit_pct = float(rmax["discount_limit"] or 20)
                  except Exception:
                      pass
              emp_limit_amt = round(max_discount * emp_limit_pct / 100.0, 2)
              if manual_discount > emp_limit_amt:
                  conn.close()
                  return jsonify({"error": f"تجاوزت حد الخصم المسموح لك ({emp_limit_pct:.0f}% = {emp_limit_amt:.2f}). المدير فقط يمكنه خصم أكثر"}), 400

          # /api/promo/verify is only a preview. Payment revalidates the code here.
          if promo_code:
              promo_row = c.execute(
                  "SELECT * FROM promo_codes WHERE code=? AND active=1",
                  (promo_code,),
              ).fetchone()
              if not promo_row:
                  conn.close()
                  return jsonify({"error": "كود غير صالح"}), 400
              if promo_row["max_uses"] > 0 and promo_row["used_count"] >= promo_row["max_uses"]:
                  conn.close()
                  return jsonify({"error": "تم استخدام هذا الكود بالكامل"}), 400
              if promo_row["expires_at"] and promo_row["expires_at"] < _now().strftime("%Y-%m-%d"):
                  conn.close()
                  return jsonify({"error": "انتهت صلاحية الكود"}), 400
              if subtotal < float(promo_row["min_order"] or 0):
                  conn.close()
                  return jsonify({"error": f"الحد الأدنى للطلب {promo_row['min_order']}"}), 400
              promo_discount = (
                  float(promo_row["discount_value"])
                  if promo_row["discount_type"] == "fixed"
                  else subtotal * float(promo_row["discount_value"]) / 100.0
              )
              promo_discount = round(min(max(promo_discount, 0), subtotal), 2)

          discount = round(min(manual_discount + promo_discount, max_discount), 2)
          total = round(subtotal + tax - discount, 2)
          if total < 0:
              total = 0
          if paid < total and payment_method != "آجل":
              conn.close()
              return jsonify({"error": f"المبلغ المدفوع أقل من الإجمالي ({total:.2f})"}), 400
'''
          s = s[:start] + new + s[end:]

          # Remove the old duplicate connection initialization.
          old_conn = '''    conn = get_db()
          c = conn.cursor()
          _ensure_schema(conn, c)
          is_new = bool(data.get("new_order"))
'''
          if old_conn not in s:
              raise SystemExit('PAY_CONN_BLOCK_NOT_FOUND')
          s = s.replace(old_conn, '    is_new = bool(data.get("new_order"))\n', 1)

          # 3) Atomically claim one promo use immediately before order writes.
          # If any later payment write fails, compensate the claim before retry.
          save_start = s.index('    # 1) INSERT/UPDATE orders', fn)
          save_end = s.index('    return jsonify(payload)', save_start) + len('    return jsonify(payload)')
          region = s[save_start:save_end]
          wrapped = '''    promo_claimed = False
          if promo_code:
              claim = c.execute(
                  "UPDATE promo_codes SET used_count=used_count+1 "
                  "WHERE id=? AND active=1 AND (max_uses=0 OR used_count<max_uses)",
                  (promo_row["id"],),
              )
              if getattr(claim, "rowcount", 0) != 1:
                  conn.close()
                  return jsonify({"error": "تم استخدام هذا الكود بالكامل"}), 400
              promo_claimed = True

          try:
''' + indent(region, '    ') + '''
          except Exception:
              if promo_claimed:
                  try:
                      c.execute(
                          "UPDATE promo_codes SET used_count=CASE WHEN used_count>0 THEN used_count-1 ELSE 0 END WHERE id=?",
                          (promo_row["id"],),
                      )
                      conn.commit()
                  except Exception:
                      pass
              try:
                  conn.close()
              except Exception:
                  pass
              raise'''
          s = s[:save_start] + wrapped + s[save_end:]

          # 4) Add an audit record only after the final invoice payload exists.
          old_payload = '''          payload = _order_payload(c, oid)
              conn.close()
              if not payload:
                  print(f"ORDER SAVE LOST: oid={oid} table={num}")
                  raise RuntimeError("connection lost during save: stream not found")
              return jsonify(payload)'''
          new_payload = '''          payload = _order_payload(c, oid)
              if not payload:
                  print(f"ORDER SAVE LOST: oid={oid} table={num}")
                  raise RuntimeError("connection lost during save: stream not found")
              if promo_claimed:
                  try:
                      promo_details = f"استخدام كود خصم {promo_code} في الطلب #{oid} - خصم {promo_discount:.2f}"
                      c.execute(
                          "INSERT INTO audit_log (employee, action, details) VALUES (?,?,?)",
                          (u["name"], "promo_use", promo_details),
                      )
                      conn.commit()
                  except Exception:
                      pass
              conn.close()
              return jsonify(payload)'''
          if old_payload not in s:
              raise SystemExit('PAYLOAD_MARKER_NOT_FOUND')
          s = s.replace(old_payload, new_payload, 1)

          app.write_text(s, encoding='utf-8')

          # 5) Send promo_code to the payment API. The displayed discount remains
          # compatible with the current UI, but the server ignores it for authority.
          js = Path('public/app.js')
          j = js.read_text(encoding='utf-8')
          old_js = 'discount: discount + promoDiscount, manual_discount: discount, payment_method: payMethod,'
          new_js = 'discount: discount + promoDiscount, manual_discount: discount, promo_code: promoCode, payment_method: payMethod,'
          if old_js not in j:
              raise SystemExit('PAYMENT_JSON_MARKER_NOT_FOUND')
          j = j.replace(old_js, new_js, 1)
          js.write_text(j, encoding='utf-8')

          py_compile.compile('app.py', doraise=True)
          s2 = app.read_text(encoding='utf-8')
          j2 = js.read_text(encoding='utf-8')
          checks = [
              'CREATE TABLE IF NOT EXISTS promo_codes',
              'promo_code = str(data.get("promo_code") or "").strip().upper()',
              'promo_discount = (',
              'UPDATE promo_codes SET used_count=used_count+1',
              'promo_claimed = False',
              'action, details',
              'promo_code: promoCode',
          ]
          missing = [x for x in checks if x not in (s2 + j2)]
          if missing:
              raise SystemExit('PROMO_VERIFY_FAILED: ' + repr(missing))
          print('PY_COMPILE_OK')
          print('PROMO_SECURITY_PATCH_OK')

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py public/app.js
          git rm .github/workflows/repair-promo-security.yml
          git commit -m 'fix: enforce promo discounts server-side and count promo usage'
          git push origin HEAD:main
