name: Fix transfer dialog labels v3
on:
  push:
    branches: [fix/transfer-dialog-labels-v3]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[transfer-labels-v3]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use computed table label in transfer buttons
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')

          old = '''    html += `<button class="transfer-table-btn" onclick="transferOrder(${tid})" ${disabled}>\n      <span>طاولة ${tb.num}</span><span style="font-size:11px">${status}</span>\n    </button>`;'''
          new = '''    html += `<button class="transfer-table-btn" onclick="transferOrder(${tid})" ${disabled}>\n      <span>طاولة ${tableLabel}</span><span style="font-size:11px">${status}</span>\n    </button>`;'''

          if old not in s:
              raise SystemExit('Expected transfer button template was not found; no unsafe edit made.')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check public/app.js
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git rm .github/workflows/fix-transfer-dialog-labels-v3.yml
          git commit -m "Fix transfer dialog table section labels [transfer-labels-v3]"
          git push
