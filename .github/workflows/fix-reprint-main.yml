name: Fix credit receipt reprint from button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch credit receipt popup flow
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')

          # Both voucher printers can reuse the window opened synchronously by the click.
          s = s.replace('function printDepositVoucher(r) {', 'function printDepositVoucher(r, existingWindow = null) {', 1)
          s = s.replace(
              'const w = window.open("", "_blank", "width=340,height=650");\n  if (!w) { toast("⚠️ " + t("toast.allowPopups")); return; }',
              'const w = existingWindow || window.open("", "_blank", "width=340,height=650");\n  if (!w) { toast("⚠️ " + t("toast.allowPopups")); return; }',
              1,
          )
          s = s.replace('function printCreditReceipt(r) {', 'function printCreditReceipt(r, existingWindow = null) {', 1)
          s = s.replace(
              'const w = window.open("", "_blank", "width=340,height=650");\n  if (!w) { toast("⚠️ " + t("toast.allowPopups")); return; }',
              'const w = existingWindow || window.open("", "_blank", "width=340,height=650");\n  if (!w) { toast("⚠️ " + t("toast.allowPopups")); return; }',
              1,
          )

          # The actual customer receipt button calls printCustReceipt directly.
          # Open the popup before any async operation, while the click is active.
          pattern = r'function printCustReceipt\(kind, receiptNo, customerName, phone, amount, method, date, ledgerId\)\s*\{.*?\n\}'
          replacement = '''function printCustReceipt(kind, receiptNo, customerName, phone, amount, method, date, ledgerId) {
  const w = window.open("", "_blank", "width=340,height=650");
  if (!w) { toast("⚠️ " + t("toast.allowPopups")); return; }

  const r = {
    receipt_no: decodeURIComponent(receiptNo || ""),
    customer_name: decodeURIComponent(customerName || ""),
    phone: decodeURIComponent(phone || ""),
    amount: Number(amount) || 0,
    method: method || "نقدي",
    date: decodeURIComponent(date || ""),
    ledger_id: Number(ledgerId) || 0
  };

  if (kind === "deposit") { printDepositVoucher(r, w); return; }
  if (kind === "credit_payment") { printCreditReceipt(r, w); return; }

  try { w.close(); } catch (_) {}
  toast("⚠️ " + t("rptNoPrintData"));
}'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('TARGET_NOT_FOUND: printCustReceipt')
          p.write_text(s2, encoding='utf-8')
          check = p.read_text(encoding='utf-8')
          assert 'function printCustReceipt(kind, receiptNo' in check
          assert 'printCreditReceipt(r, w)' in check
          assert 'printDepositVoucher(r, w)' in check
          print('PATCH_OK')
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'fix: make credit receipt reprint user initiated'
          git push
          git rm .github/workflows/fix-reprint-main.yml
          git commit -m 'chore: remove temporary credit receipt workflow'
          git push
