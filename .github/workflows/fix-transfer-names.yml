name: Fix table transfer dialog names
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-transfer-names]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix undefined section-name map
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')

          marker = 'let uiTheme = "dark";'
          const = '''\nconst TABLE_SECTION_NAMES = {\n  families: "العائلات",\n  vip: "VIP",\n  hall: "الصالة",\n  takeaway: "تيك أواي",\n};'''
          if 'const TABLE_SECTION_NAMES = {' not in s:
              s = s.replace(marker, marker + const, 1)

          s = s.replace('names[cur.section]', 'TABLE_SECTION_NAMES[cur.section]')
          s = s.replace('names[tb.section]', 'TABLE_SECTION_NAMES[tb.section]')
          s = s.replace('names[from.section]', 'TABLE_SECTION_NAMES[from.section]')
          s = s.replace('names[to.section]', 'TABLE_SECTION_NAMES[to.section]')

          p.write_text(s, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check public/app.js
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git rm .github/workflows/fix-transfer-names.yml
          git commit -m "Fix table transfer button [fix-transfer-names]"
          git push
