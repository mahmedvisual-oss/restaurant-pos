name: Fix deposit voucher reprint
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch deposit voucher printing
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('function printDepositVoucher(r) {')
          if start < 0:
              raise SystemExit('PRINT_DEPOSIT_FUNCTION_NOT_FOUND')
          end = s.find('\n}\n', start)
          # The function contains nested blocks, so locate the next known section marker instead.
          marker = '\n// ===== سند قبض (دفعة مقدمة للحفلات الخاصة) ====='
          next_marker = s.find('\n// =====', start + 10)
          if next_marker < 0:
              raise SystemExit('PRINT_DEPOSIT_END_NOT_FOUND')
          fn = s[start:next_marker]
          old = '''  w.document.close();\n  w.focus();\n  w.print();\n  w.close();'''
          new = '''  w.document.close();\n\n  // Keep the popup alive until the browser has started the print dialog.\n  setTimeout(() => {\n    try {\n      w.focus();\n      w.print();\n    } catch (e) {\n      console.error("DEPOSIT PRINT ERROR:", e);\n      toast("⚠️ " + t("toast.allowPopups"));\n    }\n  }, 150);'''
          if old not in fn:
              raise SystemExit('PRINT_DEPOSIT_TAIL_NOT_FOUND')
          fn2 = fn.replace(old, new, 1)
          s = s[:start] + fn2 + s[next_marker:]
          p.write_text(s, encoding='utf-8')
          print('PATCH_OK')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'fix: keep deposit voucher print window open'
          git push
          git rm .github/workflows/fix-deposit-reprint.yml
          git commit -m 'chore: remove temporary deposit reprint workflow'
          git push
