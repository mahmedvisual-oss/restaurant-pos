name: Repair credit accounting
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/repair-credit-accounting.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair legacy fake credit payments
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py'); s=p.read_text(encoding='utf-8')
          old='''        if closed_paid > 0:\n            c.execute("INSERT INTO credit_payments (ledger_id, amount, method, employee, date) "\n                      "VALUES (?,?,?,?,?)", (lid, closed_paid, "آجل", "مدير", ro["date"] or _now_sql()))\n'''
          new='''        # IMPORTANT: creating an invoice on credit is NOT a collection.\n        # Do not create credit_payments here; payments are created only by an\n        # actual collection/receipt endpoint. Legacy fake rows are cleaned below.\n'''
          if old not in s: raise SystemExit('legacy fake-payment block not found')
          s=s.replace(old,new,1)
          marker='''    # تنظيف الدفع الزائد القديم: لا رصيد برصيد سالب ولا paid أكبر من total (يُحسب الفرق كباقي رُدّ)\n'''
          cleanup='''    # Remove legacy rows that were incorrectly created with the invoice method "آجل".\n    # They are not real collections and must never inflate customer payments.\n    c.execute("DELETE FROM credit_payments WHERE method='آجل'")\n'''
          if marker not in s: raise SystemExit('cleanup marker not found')
          s=s.replace(marker,cleanup+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-credit-accounting.yml
          git add app.py
          git commit -m 'Fix credit invoices being counted as collections' || exit 0
          git push origin HEAD:main
